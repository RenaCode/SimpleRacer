# Projekt Xcode generuje XcodeGen: `xcodegen generate`. Plik .xcodeproj nie trafia do repo.
name: SimpleRacer
# Konfiguracje: Debug (rozwój), Family (zoptymalizowana + modele prywatne — na iPady dzieci),
# Release (App Store — bez modeli z PrivateOnly).
configs:
  Debug: debug
  Family: release
  Release: release
options:
  bundleIdPrefix: com.renacode
  deploymentTarget:
    iOS: "18.0"
packages:
  RaceCore:
    path: RaceCore
targets:
  SimpleRacer:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Models/**", "Impostors/**", "Info.plist"]
      # Modele 3D jako katalog w paczce aplikacji (Bundle: Models/Cars, Models/City, Models/Track).
      - path: App/Models
        type: folder
        buildPhase: resources
      # Impostory drzew (zdjęcia z modeli CC0 Poly Haven) — katalog z impostors.json i obrazkami.
      - path: App/Impostors
        type: folder
        buildPhase: resources
    dependencies:
      - package: RaceCore
    # Modele lokalne (LocalModels/, poza repozytorium) → Models/Realistic w paczce aplikacji.
    # PrivateOnly/ (licencje niekomercyjne, marki) trafia WYŁĄCZNIE do Debug i Family — Release nigdy go nie zawiera.
    postBuildScripts:
      - name: Copy local models
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/LocalModels"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Models/Realistic"
          rm -rf "$DST"
          [ -d "$SRC" ] || exit 0
          mkdir -p "$DST"
          # Wydanie (płatne): build przerywa się, gdy jakikolwiek model nie ma licencji komercyjnej.
          if [ "$CONFIGURATION" = "Release" ] && [ -d "$SRC/Commercial" ]; then
            /usr/bin/python3 "$SRCROOT/tools/check-licenses.py" "$SRC/Commercial"
          fi
          # Tylko główny katalog: modele aut i opisy. Modele otoczenia (Commercial/scenery/) są źródłem
          # impostorów (tools/make-impostors.swift) — do gry trafiają tylko ich zdjęcia (Commercial/impostors/).
          find "$SRC/Commercial" -maxdepth 1 -name '*.json' -exec cp {} "$DST/" \; 2>/dev/null || true
          find "$SRC/Commercial" -maxdepth 1 -name '*.usdz' -exec cp {} "$DST/" \; 2>/dev/null || true
          if [ -d "$SRC/Commercial/impostors" ]; then cp -R "$SRC/Commercial/impostors" "$DST/"; fi
          if [ "$CONFIGURATION" = "Debug" ] || [ "$CONFIGURATION" = "Family" ]; then
            find "$SRC/PrivateOnly" -name '*.usdz' -exec cp {} "$DST/" \; 2>/dev/null || true
            [ -f "$SRC/PrivateOnly/cars.json" ] && cp "$SRC/PrivateOnly/cars.json" "$DST/cars-private.json"
          fi
          echo "Modele lokalne ($CONFIGURATION): $(ls "$DST" | tr '\n' ' ')"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renacode.simpleracer
        PRODUCT_NAME: SimpleRacer
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SimpleRacer
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # Ekran startowy (ciemne tło z logo) w App/Info.plist; Xcode dokleja do niego klucze INFOPLIST_KEY_*.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.racing-games
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Skrypt kopiujący modele lokalne czyta katalog spoza listy plików projektu.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Family: optymalizacje jak w Release, ale z argumentami testowymi i logami jak w Debug.
        Family:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: FAMILY
schemes:
  SimpleRacer:
    build:
      targets:
        SimpleRacer: all
    # „Run” w Xcode buduje Family — zoptymalizowaną wersję z prywatnymi modelami (na iPady dzieci).
    run:
      config: Family
    archive:
      config: Release
